# ============================================
# MRClans - config.yml
# Cada opção está comentada. Guia completo no LEIA-ME.txt
# ============================================
config-version: 1

cla:
  nome-min: 3
  nome-max: 16
  tag-min: 2
  tag-max: 5
  max-membros: 20
  custo-criar: 0
  convite-expira-segundos: 300

chat:
  tag-colorida: true
  # Placeholders: {tag} {jogador} {mensagem}
  formato: '&7[{tag}&7] &f{jogador}&7: &f{mensagem}'

home:
  delay-segundos: 3
  cooldown:
    lider: 60
    moderador: 120
    membro: 300

ranking:
  reset-dias: 7
  metrica: kills

diario:
  max-eventos: 50

persistencia:
  tipo: json
  auto-save-segundos: 300
